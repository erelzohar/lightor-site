name: Deploy

# Deploys on every push to main. Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
    # LT-430: the blog's notes (topic list, facts, how-to) change no page.
    paths-ignore:
      - 'blog/topics.md'
      - 'blog/FACTS.md'
      - 'blog/README.md'
      - 'README.md'
  workflow_dispatch:

# Never let two deploys overlap; a half-swapped dist directory is the one state
# worse than an old one.
concurrency:
  group: deploy-lightor-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # LT-618: the whole history, so scripts/sitemap-dates.mjs can date each
      # page by the last commit that changed it (a shallow clone knows one).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately not `npm run lint`: this repo was adapted from an existing
      # site and carries pre-existing lint debt. The build is the real gate —
      # deploy.sh additionally refuses to ship a page whose crawlable summary
      # has gone missing.
      - name: Build
        run: npm run build

      - name: Authorise the runner against the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # Through env, not spliced into the script (LT-635).
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          host="${DEPLOY_HOST#*@}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s\n" "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A private key is multi-line. Pasted into a secret by hand it can
          # arrive as a single line, and ssh then answers with a bare
          # "Permission denied (publickey)" that names the server rather than
          # the key. Check the shape before blaming the box.
          lines=$(wc -l < ~/.ssh/deploy_key)
          if [ "$lines" -lt 3 ]; then
            echo "✗ DEPLOY_SSH_KEY is $lines line(s) — its newlines were lost."
            echo "  Re-set it from the file, never by pasting:"
            echo "  gh secret set DEPLOY_SSH_KEY -R erelzohar/lightor-site < ~/.ssh/lightor-deploy-ci"
            exit 1
          fi

          # Pin the host key so a hijacked DNS/IP cannot silently receive a deploy.
          # The box's own ed25519 key is written here (LT-635, LT-631): a scan on
          # every run took whatever answered on the address. If the box is ever
          # rebuilt, put its new key here (`ssh-keyscan -t ed25519 <host>`,
          # checked against the server itself).
          PINNED="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdrSjClezr61TMIHwB42Ed139fAOyT0lEvK3FKdUUQ9"
          seen=$(ssh-keyscan -T 10 -t ed25519 "$host" 2>/dev/null | grep -v '^#' | awk '{print $2" "$3}' || true)
          if [ -z "$seen" ]; then
            echo "✗ cannot reach $host:22 from this runner."
            echo "  The server firewall is open, so this is the security group."
            exit 1
          fi
          if [ "$seen" != "$PINNED" ]; then
            echo "✗ $host answers with a host key that is not the pinned one. Not deploying."
            exit 1
          fi
          echo "$host $PINNED" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: KEY="$HOME/.ssh/deploy_key" ./deploy.sh

      # LT-430, LT-618: tell Bing and the other IndexNow engines about the
      # pages dated today - a new or revised post, the home pages, pricing
      # (Google reads the sitemap). Never fails the deploy.
      - name: Notify search engines of changed pages
        continue-on-error: true
        run: node scripts/blog/indexnow.mjs

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
