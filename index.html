    <div id="root"></div>
    <!--
      Real content, not a "please enable JavaScript" stub. Google's OAuth
      branding review and other crawlers judge this page on whether it explains
      what the app does without running scripts, and a bare SPA shell reads as
      an empty page. Keep this in step with the hero and features copy.
    -->
    <noscript>
      <main>
        <h1>Lightor — booking websites and appointment management for small service businesses</h1>
        <p>
          Lightor gives a small service business its own booking website and takes
          appointments for it, day and night. You describe your business once, and
          Lightor writes and publishes a booking page at your own address, with your
          services, prices and opening hours.
        </p>
        <p>
          Customers choose a service and a free slot themselves, so there are no phone
          calls to answer and no double bookings. Every appointment arrives in a single
          calendar you can open on a phone or a computer, and confirmations and reminders
          are sent by text message or WhatsApp automatically, so fewer people fail to
          turn up.
        </p>
        <h2>What Lightor does</h2>
        <ul>
          <li>Builds and publishes a booking website for your business.</li>
          <li>Takes bookings from your customers around the clock.</li>
          <li>Keeps every appointment in one calendar.</li>
          <li>Sends booking confirmations and reminders automatically.</li>
          <li>Follows your working hours, breaks, one-off changes and holidays.</li>
          <li>Remembers your customers and their booking history.</li>
        </ul>
        <p>
          Lightor is used by barbers, clinics, studios and salons. It is free to start,
          needs no installation, and is available in Hebrew, English, Arabic, Spanish and
          French.
        </p>
        <p>
          <a href="https://register.lightor.app">Create your booking site</a> &middot;
          <a href="https://dashboard.lightor.app">Sign in</a> &middot;
          <a href="https://lightor.app/privacy.html">Privacy Policy</a> &middot;
          <a href="https://lightor.app/terms.html">Terms of Service</a>
        </p>
