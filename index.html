  <body>
    <div id="root"></div>
    <!--
      Real content, not a "please enable JavaScript" stub. Google's OAuth
      branding review and other crawlers judge this page on whether it explains
      what the app does without running scripts, and a bare SPA shell reads as
      an empty page. Keep this in step with the hero and features copy.
    -->
    <noscript>
      <main>
        <h1>Lightor — your business website in 60 seconds, built with Lighty</h1>
        <p>
          Lightor gives a small service business its own website. You tell Lighty, its AI
          assistant, what your business does and where, and Lighty writes the copy, picks a
          design and publishes the site at your own lightor.app address.
        </p>
        <h2>Two kinds of sites</h2>
        <ul>
          <li>A booking site: customers choose a service and a free slot themselves, from your
            real hours — classes and groups included — and get a confirmation and a reminder by
            text message or WhatsApp.</li>
          <li>A leads site, for businesses that work by quote: an inquiry form with your own
            questions, every inquiry in one place with its status, and an instant alert.</li>
        </ul>
        <h2>Lighty, the AI assistant</h2>
        <ul>
          <li>Builds your site from a conversation.</li>
          <li>Edit any part of your site with a click — by hand or with Lighty.</li>
          <li>Answers questions about your business: bookings, customers and inquiries.
            Your customers' contact details are never sent to the AI.</li>
        </ul>
        <p>
          Lightor is for salons, clinics, studios, therapists and businesses that work by
          quote. It is free to start, needs no installation, and is available in Hebrew,
          English, Arabic, French and Spanish.
        </p>
        <p>
          <a href="https://register.lightor.app">Build your site free</a> &middot;
          <a href="https://lightor.app/sites">Businesses built with Lightor</a> &middot;
          <a href="https://dashboard.lightor.app">Sign in</a> &middot;
          <a href="https://lightor.app/support.html">Support</a> &middot;
          <a href="https://lightor.app/privacy.html">Privacy Policy</a> &middot;
          <a href="https://lightor.app/terms.html">Terms of Service</a>
        </p>
      </main>
