    <!--
      Real content, not a "please enable JavaScript" stub. Google's OAuth
      branding review and other crawlers judge this page on whether it explains
      what the app does without running scripts, and a bare SPA shell reads as
      an empty page. Keep this in step with the hero and features copy.
    -->
    <noscript>
      <main>
        <h1>Lightor - your website in 60 seconds, built with Lighty</h1>
        <p>
          Lightor gives anyone a website of their own - for a business, an event, a landing page
          or any idea. You tell Lighty, its AI assistant, what the site is about, and Lighty writes
          the copy, picks a design and publishes the site at your own lightor.app address.
        </p>
        <h2>What a site can do</h2>
        <ul>
          <li>Every site: a page about who you are and what you offer, a gallery, reviews and
            FAQ, WhatsApp and phone buttons, and your own address on Google.</li>
          <li>Take bookings: customers choose a service and a free slot themselves, from your
            real hours - classes and groups included - and get a confirmation and a reminder by
            text message or WhatsApp.</li>
          <li>Get inquiries: a form with your own questions - for quotes, sign-ups or call-backs -
            every inquiry in one place with its status, and an instant alert.</li>
        </ul>
        <h2>Lighty, the AI assistant</h2>
        <ul>
          <li>Builds your site from a conversation.</li>
          <li>Edit any part of your site with a click - by hand or with Lighty.</li>
          <li>Answers questions from your own data: bookings, customers and inquiries.</li>
        </ul>
        <p>
          Every site is promoted organically: search engines are updated on every change, the content
          is marked up so search engines understand it, and each site is linked from lightor.app/sites.
          Lightor works for businesses, events, landing pages and any idea. It is free to start, needs no installation, and is available in Hebrew,
          English, Arabic, French and Spanish.
        </p>
        <p>
