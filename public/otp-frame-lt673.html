<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LT-673 code frame</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; color: #111; background: #fff; }
  input { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 8px; border: 1px solid #999; border-radius: 6px; font: inherit; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #5b3df5; color: #fff; font: inherit; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  pre { margin: 8px 0 0; padding: 8px; background: #f3f3f5; border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
</style>
</head>
<body>
<!--
  LT-673 spike. Firebase sends a phone code only from a host on the project's
  authorized list, and an entry does not cover its subdomains. So the check
  would live in one frame on lightor.app that every site embeds. This page is
  that frame, for a test. The project's public config arrives in the address
  (after #), not in this file.
-->
<b>Code frame on <span id="host"></span></b>
<input id="phone" type="tel" autocomplete="tel" placeholder="+9725XXXXXXXX" />
<button id="send">Send code</button>
<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 digits" />
<button id="confirm" disabled>Confirm code</button>
<pre id="log"></pre>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut, inMemoryPersistence, setPersistence }
    from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';

  const $ = (id) => document.getElementById(id);
  const tell = (message) => { try { parent.postMessage({ source: 'lt673', ...message }, '*'); } catch {} };
  const log = (label, value) => {
    const line = `${new Date().toISOString().slice(11, 19)}  ${label}` + (value === undefined ? '' : `  ${value}`);
    $('log').textContent += line + '\n';
    tell({ line });
  };
  $('host').textContent = location.host + (window.top === window ? '' : ' (inside a frame)');

  let config;
  try {
    config = JSON.parse(atob(location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/')));
  } catch {
    log('no config in the address');
  }

  if (config) {
    const auth = getAuth(initializeApp(config));
    auth.languageCode = 'en';
    // A frame on another site's page has no dependable storage, and nothing
    // should stay signed in anyway.
    await setPersistence(auth, inMemoryPersistence);
    let verifier = null;
    let pending = null;

    $('send').addEventListener('click', async () => {
      const phone = $('phone').value.replace(/[\s()-]/g, '');
      $('send').disabled = true;
      const started = performance.now();
      try {
        verifier ||= new RecaptchaVerifier(auth, 'send', { size: 'invisible' });
        pending = await signInWithPhoneNumber(auth, phone, verifier);
        log('code sent', `${Math.round(performance.now() - started)} ms`);
        $('confirm').disabled = false;
        $('code').focus();
      } catch (e) {
        log('SEND FAILED', `${e.code || ''} ${e.message || e}`);
        try { verifier && verifier.clear(); } catch {}
        verifier = null;
      } finally {
        $('send').disabled = false;
      }
    });

    $('confirm').addEventListener('click', async () => {
      if (!pending) return;
      $('confirm').disabled = true;
      try {
        const result = await pending.confirm($('code').value.trim());
        const token = await result.user.getIdToken();
        log('code accepted by Firebase', `token ${token.length} chars`);
        tell({ ok: true, tokenLength: token.length });
        await signOut(auth);
        log('signed out of Firebase');
      } catch (e) {
        log('CONFIRM FAILED', `${e.code || ''} ${e.message || e}`);
        $('confirm').disabled = false;
      }
    });

    log('ready', config.projectId);
  }
</script>
</body>
</html>
