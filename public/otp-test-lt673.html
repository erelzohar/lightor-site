<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LT-673 phone code spike</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #111; background: #fff; }
  h1 { font-size: 20px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { font: inherit; padding: 10px 12px; width: 100%; box-sizing: border-box; border: 1px solid #999; border-radius: 8px; }
  button { font: inherit; margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #5b3df5; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  pre { background: #f3f3f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .host { color: #555; font-size: 13px; }
</style>
</head>
<body>
<h1>LT-673: a phone code through Firebase</h1>
<p class="host">Page host: <b id="host"></b></p>

<label for="phone">Phone, with country code (+972..., +1...)</label>
<input id="phone" type="tel" autocomplete="tel" placeholder="+9725XXXXXXXX" />
<button id="send">Send code</button>

<label for="code">The 6 digits from the SMS</label>
<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
<button id="confirm" disabled>Confirm code</button>

<div id="tokenBox" hidden>
  <label for="token">ID token (the proof the server would check)</label>
  <textarea id="token" readonly rows="4" style="width:100%;box-sizing:border-box;font:12px monospace"></textarea>
  <button id="copy" type="button">Copy token</button>
</div>

<h2 style="font-size:16px;margin-top:24px">Log</h2>
<pre id="log"></pre>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut }
    from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';

  const config = {"apiKey": "AIzaSyDIrHJlfDv7etrwxnlyvlGu1tHJXOEbex8", "authDomain": "lightor-275c3.firebaseapp.com", "projectId": "lightor-275c3", "appId": "1:303325632008:web:b1fcf4bf9ec96ec24823bd"};
  const $ = (id) => document.getElementById(id);
  const log = (label, value) => {
    const line = `${new Date().toISOString().slice(11, 19)}  ${label}` +
      (value === undefined ? '' : `  ${typeof value === 'string' ? value : JSON.stringify(value)}`);
    $('log').textContent += line + '\n';
    (window.__log ||= []).push(line);
  };
  $('host').textContent = location.host;

  const auth = getAuth(initializeApp(config));
  auth.languageCode = 'en';
  let verifier = null;
  let pending = null;

  $('send').addEventListener('click', async () => {
    const phone = $('phone').value.replace(/[\s()-]/g, '');
    $('send').disabled = true;
    const started = performance.now();
    try {
      verifier ||= new RecaptchaVerifier(auth, 'send', { size: 'invisible' });
      pending = await signInWithPhoneNumber(auth, phone, verifier);
      log('code sent', `${Math.round(performance.now() - started)} ms`);
      $('confirm').disabled = false;
      $('code').focus();
    } catch (e) {
      log('SEND FAILED', `${e.code || ''} ${e.message || e}`);
      try { verifier && verifier.clear(); } catch {}
      verifier = null;
    } finally {
      $('send').disabled = false;
    }
  });

  $('confirm').addEventListener('click', async () => {
    if (!pending) return;
    $('confirm').disabled = true;
    try {
      const result = await pending.confirm($('code').value.trim());
      log('code accepted by Firebase', result.user.phoneNumber);
      const token = await result.user.getIdToken();
      window.__token = token;
      document.getElementById('token').value = token;
      document.getElementById('tokenBox').hidden = false;
      log('ID token ready', `${token.length} chars`);
      // The API would keep its own session; nothing stays signed in to Firebase.
      await signOut(auth);
      log('signed out of Firebase');
    } catch (e) {
      log('CONFIRM FAILED', `${e.code || ''} ${e.message || e}`);
      $('confirm').disabled = false;
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('token').value); log('token copied'); }
    catch { $('token').select(); log('select the token and copy it by hand'); }
  });

  log('ready', config.projectId);
</script>
</body>
</html>
